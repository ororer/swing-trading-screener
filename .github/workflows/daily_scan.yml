name: Daily Swing Screener

on:
  schedule:
    # רץ כל יום בשעה 21:00 UTC (שזה 23:00 או 24:00 שעון ישראל, אחרי סגירת המסחר)
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # מאפשר לך להריץ את זה גם ידנית בלחיצת כפתור

jobs:
  run-screener:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Run Screener Script
      run: python screener.py

    - name: Commit and Push Results
      run: |
        git config --global user.name "Screener-Bot"
        git config --global user.email "bot@swing-portfolio.com"
        git add screener_results_v2.json
        git commit -m "Auto-update stock screener results" || echo "No new setups found today"
        git push
