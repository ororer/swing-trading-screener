<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swing Tracker</title>
    
    <!-- הגדרות להפיכה לאפליקציית iOS / PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SwingApp">
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/bullish.png">

    <!-- ספריות Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* הדר עליון */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #1e1e1e; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
        .header h2 { margin: 0; font-size: 1.1em; font-weight: 700; color: #4caf50; }
        .header-controls { display: flex; align-items: center; gap: 8px; }
        
        .search-box { display: flex; align-items: center; background: #2a2a2a; border: 1px solid #444; border-radius: 20px; overflow: hidden; height: 34px; }
        .search-box input { background: transparent; border: none; color: #fff; padding: 0 10px; outline: none; width: 90px; font-size: 0.9em; }
        .search-box button { background: #4caf50; border: none; color: white; padding: 0 12px; height: 100%; cursor: pointer; font-weight: bold; }
        
        .theme-btn { background: #2a2a2a; color: #fff; border: 1px solid #444; height: 34px; padding: 0 10px; border-radius: 20px; font-size: 0.85em; cursor: pointer; }
        
        /* גוף האפליקציה */
        .container { display: flex; height: calc(100vh - 120px); flex-direction: column; }
        
        .view-section { display: none; height: 100%; overflow-y: auto; padding: 12px; }
        .view-section.active { display: block; }
        
        #chart-view { height: 100%; padding: 0; }
        #tv_chart_container { width: 100%; height: 100%; }
        
        /* רשימת מניות */
        .stock-item { padding: 12px 14px; margin-bottom: 8px; background: #1e1e1e; border-radius: 10px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .stock-item:active { background: #2a2a2a; }
        .stock-ticker { font-size: 1.1em; font-weight: bold; color: #4caf50; }
        .stock-price { font-weight: 600; color: #ddd; }
        
        /* טופס וכרטיסי עסקאות */
        .portfolio-form { background: #1e1e1e; padding: 14px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #333; display: flex; flex-direction: column; gap: 8px; }
        .form-row { display: flex; gap: 8px; }
        .portfolio-form input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 0.95em; }
        .portfolio-form button { background: #1976d2; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1em; font-weight: bold; }
        
        .trade-card { background: #1e1e1e; padding: 14px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid #1976d2; border-top: 1px solid #2a2a2a; border-right: 1px solid #2a2a2a; border-bottom: 1px solid #2a2a2a; }
        .trade-card.closed { border-left-color: #757575; opacity: 0.85; }
        .trade-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .trade-stats { font-size: 0.9em; color: #bbb; line-height: 1.5; }
        .trade-actions { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
        
        .btn-sm { background: #333; color: white; border: 1px solid #555; padding: 6px 12px; border-radius: 6px; font-size: 0.85em; }
        .close-btn { background: #d32f2f; border-color: #b71c1c; }
        .profit { color: #4caf50; font-weight: bold; }
        .loss { color: #f44336; font-weight: bold; }
        .date-badge { font-size: 0.75em; background: #2a2a2a; padding: 3px 6px; border-radius: 4px; color: #aaa; margin-left: 4px; }

        /* סרגל ניווט תחתון (כמו באפליקציות נייד) */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #1e1e1e; border-top: 1px solid #333; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #888; font-size: 0.75em; border: none; background: transparent; cursor: pointer; gap: 3px; }
        .nav-item.active { color: #4caf50; font-weight: bold; }
        .nav-icon { font-size: 1.3em; }

        /* תצוגת דסקטופ (מעל 768px) */
        @media (min-width: 768px) {
            .container { flex-direction: row; height: 85vh; padding: 20px; gap: 20px; }
            .bottom-nav { display: none; }
            .sidebar-desktop { width: 420px; background: #1e1e1e; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
            .desktop-tabs { display: flex; border-bottom: 1px solid #333; }
            .desktop-tab-btn { flex: 1; padding: 12px; background: transparent; border: none; color: #888; cursor: pointer; font-size: 1em; }
            .desktop-tab-btn.active { color: #4caf50; border-bottom: 2px solid #4caf50; font-weight: bold; }
            .view-section { display: none !important; }
            .view-section.d-active { display: block !important; }
            #chart-view { display: block !important; flex: 1; }
        }

        /* מצב יום */
        body.light-mode { background-color: #f4f6f9; color: #222; }
        body.light-mode .header, body.light-mode .bottom-nav, body.light-mode .sidebar-desktop { background: #fff; border-color: #ddd; }
        body.light-mode .stock-item, body.light-mode .portfolio-form, body.light-mode .trade-card { background: #fff; border-color: #ddd; }
        body.light-mode .portfolio-form input, body.light-mode .search-box input { background: #f9f9f9; color: #222; }
        body.light-mode .date-badge { background: #eef1f5; color: #555; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Swing Tracker</h2>
        <div class="header-controls">
            <div class="search-box">
                <input type="text" id="manualSearch" placeholder="סימול..." onkeypress="if(event.key === 'Enter') searchManualStock()">
                <button onclick="searchManualStock()">🔍</button>
            </div>
            <button class="theme-btn" id="themeToggleBtn" onclick="toggleTheme()">☀️</button>
        </div>
    </div>

    <div class="container">
        <!-- מסך סורק מניות -->
        <div id="screener-section" class="view-section active">
            <div id="stockList"><p style="text-align:center; color:#888;">טוען סריקה...</p></div>
        </div>
        
        <!-- מסך תיק השקעות -->
        <div id="portfolio-section" class="view-section">
            <div class="portfolio-form">
                <b style="font-size:0.95em;">הוספת פוזיציה חדשה</b>
                <div class="form-row">
                    <input type="text" id="tradeTicker" placeholder="סימול (AAPL)">
                    <input type="date" id="tradeDate">
                </div>
                <div class="form-row">
                    <input type="number" id="tradePrice" placeholder="מחיר קנייה ($)" step="0.01">
                    <input type="number" id="tradeComm" placeholder="עמלה ($)" step="0.01">
                </div>
                <button onclick="addTrade()">הוסף לתיק</button>
            </div>
            <div id="portfolioList"><p style="text-align:center; color:#888;">טוען נתונים...</p></div>
        </div>

        <!-- מסך גרף -->
        <div id="chart-view" class="view-section">
            <div id="tv_chart_container"></div>
        </div>
    </div>

    <!-- סרגל תחתון למובייל -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchMobileTab('screener-section', this)">
            <span class="nav-icon">🔍</span>
            <span>סורק</span>
        </button>
        <button class="nav-item" onclick="switchMobileTab('chart-view', this)">
            <span class="nav-icon">📈</span>
            <span>גרף</span>
        </button>
        <button class="nav-item" onclick="switchMobileTab('portfolio-section', this)">
            <span class="nav-icon">💼</span>
            <span>תיק</span>
        </button>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD0JgU15_MKcwZK0eZIRinqnrOJYppzgp8",
            authDomain: "swing-portfolio.firebaseapp.com",
            projectId: "swing-portfolio",
            storageBucket: "swing-portfolio.firebasestorage.app",
            messagingSenderId: "1021148994913",
            appId: "1:1021148994913:web:d31fadc54acace2cafb920"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let widget;
        let currentTheme = 'dark';
        let currentSymbol = 'SPY';
        
        document.getElementById('tradeDate').valueAsDate = new Date();

        function initChart(ticker) {
            currentSymbol = ticker;
            const bgColor = currentTheme === 'light' ? "#ffffff" : "#121212";
            widget = new TradingView.widget({
                "autosize": true, "symbol": ticker, "interval": "D", "timezone": "Etc/UTC",
                "theme": currentTheme, "style": "1", "locale": "he_IL", "enable_publishing": false,
                "backgroundColor": bgColor, "hide_top_toolbar": false, "save_image": false,
                "container_id": "tv_chart_container"
            });
        }

        function openChartForStock(ticker) {
            initChart(ticker);
            const chartBtn = document.querySelectorAll('.nav-item')[1];
            switchMobileTab('chart-view', chartBtn);
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            currentTheme = document.body.classList.contains('light-mode') ? 'light' : 'dark';
            document.getElementById('themeToggleBtn').innerText = currentTheme === 'light' ? '🌙' : '☀️';
            initChart(currentSymbol);
        }

        function switchMobileTab(sectionId, btn) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(btn) btn.classList.add('active');
            
            if(sectionId === 'portfolio-section') loadTrades();
            if(sectionId === 'chart-view' && !widget) initChart(currentSymbol);
        }

        function searchManualStock() {
            const ticker = document.getElementById('manualSearch').value.toUpperCase().trim();
            if(ticker) openChartForStock(ticker);
        }

        async function loadScreenerData() {
            try {
                const response = await fetch('screener_results_v2.json?nocache=' + new Date().getTime());
                const data = await response.json();
                const list = document.getElementById('stockList');
                list.innerHTML = '';
                
                data.stocks.forEach((stock) => {
                    const div = document.createElement('div');
                    div.className = 'stock-item';
                    div.innerHTML = `
                        <div>
                            <span class="stock-ticker">${stock.ticker}</span>
                            <div style="font-size:0.8em; color:#888;">${stock.recommendation || 'מגמה עולה'}</div>
                        </div>
                        <div class="stock-price">$${stock.price} ➔</div>
                    `;
                    div.onclick = () => openChartForStock(stock.ticker);
                    list.appendChild(div);
                });
                if(data.stocks.length > 0) currentSymbol = data.stocks[0].ticker;
            } catch (e) {
                document.getElementById('stockList').innerHTML = '<p style="text-align:center; color:#888;">חפש מניה או המתן לסריקה.</p>';
            }
        }

        async function addTrade() {
            const ticker = document.getElementById('tradeTicker').value.toUpperCase().trim();
            const buyPrice = parseFloat(document.getElementById('tradePrice').value);
            const buyComm = parseFloat(document.getElementById('tradeComm').value) || 0;
            const buyDate = document.getElementById('tradeDate').value || new Date().toISOString().split('T')[0];
            
            if(!ticker || !buyPrice) { alert("הכנס סימול ומחיר קנייה."); return; }
            
            await db.collection("trades").add({
                ticker, buyPrice, buyComm, buyDate,
                status: 'open',
                timestamp: new Date().getTime()
            });
            
            document.getElementById('tradeTicker').value = '';
            document.getElementById('tradePrice').value = '';
            document.getElementById('tradeComm').value = '';
        }

        async function closeTrade(docId, buyPrice, buyComm) {
            const sellPrice = parseFloat(prompt("הכנס שער מכירה ($):"));
            if(!sellPrice) return;
            const sellComm = parseFloat(prompt("עמלת מכירה ($):", "0")) || 0;
            const today = new Date().toISOString().split('T')[0];
            const sellDate = prompt("תאריך מכירה (YYYY-MM-DD):", today) || today;
            
            const totalCost = buyPrice + buyComm;
            const totalReturn = sellPrice - sellComm;
            const pnlDollars = (totalReturn - totalCost).toFixed(2);
            const pnlPercent = (((totalReturn - totalCost) / totalCost) * 100).toFixed(2);
            
            await db.collection("trades").doc(docId).update({
                sellPrice, sellComm, sellDate, status: 'closed',
                pnlDollars, pnlPercent
            });
        }

        async function editTrade(docId, dataStr) {
            const trade = JSON.parse(decodeURIComponent(dataStr));
            const newBuyPrice = parseFloat(prompt("שער קנייה מעודכן:", trade.buyPrice)) || trade.buyPrice;
            const newBuyComm = parseFloat(prompt("עמלת קנייה מעודכנת:", trade.buyComm)) || 0;
            const newBuyDate = prompt("תאריך קנייה מעודכן (YYYY-MM-DD):", trade.buyDate) || trade.buyDate;
            
            let updateData = { buyPrice: newBuyPrice, buyComm: newBuyComm, buyDate: newBuyDate };
            
            if (trade.status === 'closed') {
                const newSellPrice = parseFloat(prompt("שער מכירה מעודכן:", trade.sellPrice)) || trade.sellPrice;
                const newSellComm = parseFloat(prompt("עמלת מכירה מעודכנת:", trade.sellComm)) || 0;
                const newSellDate = prompt("תאריך מכירה מעודכן (YYYY-MM-DD):", trade.sellDate) || trade.sellDate;
                
                const totalCost = newBuyPrice + newBuyComm;
                const totalReturn = newSellPrice - newSellComm;
                updateData.sellPrice = newSellPrice;
                updateData.sellComm = newSellComm;
                updateData.sellDate = newSellDate;
                updateData.pnlDollars = (totalReturn - totalCost).toFixed(2);
                updateData.pnlPercent = (((totalReturn - totalCost) / totalCost) * 100).toFixed(2);
            }
            
            await db.collection("trades").doc(docId).update(updateData);
        }

        async function deleteTrade(docId) {
            if(confirm("האם למחוק עסקה זו לצמיתות?")) {
                await db.collection("trades").doc(docId).delete();
            }
        }

        function loadTrades() {
            db.collection("trades").orderBy("timestamp", "desc").onSnapshot((querySnapshot) => {
                const list = document.getElementById('portfolioList');
                list.innerHTML = '';
                
                if(querySnapshot.empty) {
                    list.innerHTML = '<p style="text-align:center; color:#888;">התיק ריק כרגע.</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const trade = doc.data();
                    const div = document.createElement('div');
                    div.className = `trade-card ${trade.status}`;
                    const safeDataStr = encodeURIComponent(JSON.stringify(trade));
                    
                    let statusHtml = '';
                    if(trade.status === 'open') {
                        statusHtml = `<button class="btn-sm close-btn" onclick="closeTrade('${doc.id}', ${trade.buyPrice}, ${trade.buyComm})">סגור פוזיציה</button>`;
                    } else {
                        let pnlClass = trade.pnlDollars >= 0 ? 'profit' : 'loss';
                        statusHtml = `<div class="${pnlClass}">תשואה: ${trade.pnlPercent}% ($${trade.pnlDollars})</div>`;
                    }

                    let datesHtml = `<span class="date-badge">קנייה: ${trade.buyDate || '-'}</span>`;
                    if(trade.status === 'closed' && trade.sellDate) {
                        datesHtml += `<span class="date-badge">מכירה: ${trade.sellDate}</span>`;
                    }

                    div.innerHTML = `
                        <div class="trade-header" onclick="openChartForStock('${trade.ticker}')">
                            <span class="stock-ticker">${trade.ticker}</span>
                            <span style="font-size:0.85em;">${trade.status === 'open' ? '🟢 פתוח' : '⚪ סגור'}</span>
                        </div>
                        <div style="margin-bottom: 6px;">${datesHtml}</div>
                        <div class="trade-stats">
                            <b>קנייה:</b> $${trade.buyPrice} (עמלה: $${trade.buyComm})<br>
                            ${trade.status === 'closed' ? `<b>מכירה:</b> $${trade.sellPrice} (עמלה: $${trade.sellComm})` : ''}
                        </div>
                        <div class="trade-actions">
                            ${statusHtml}
                            <button class="btn-sm" onclick="editTrade('${doc.id}', '${safeDataStr}')">✏️</button>
                            <button class="btn-sm" style="margin-right:auto; background:transparent; border:none; color:#888;" onclick="deleteTrade('${doc.id}')">🗑️</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            });
        }

        loadScreenerData();
    </script>
</body>
</html>
