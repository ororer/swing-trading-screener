<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swing Tracker Pro</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SwingApp">
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/bullish.png">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 0; overflow: hidden; height: 100vh; }
        
        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #1a1a1a; border-bottom: 1px solid #2d2d2d; height: 52px; }
        .header-title { font-size: 1.1em; font-weight: 700; color: #4caf50; display: flex; align-items: center; gap: 6px; }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        
        .search-container { display: flex; align-items: center; background: #262626; border: 1px solid #3d3d3d; border-radius: 18px; overflow: hidden; height: 32px; }
        .search-container input { background: transparent; border: none; color: #fff; padding: 0 10px; outline: none; width: 80px; font-size: 0.85em; }
        .search-container button { background: #4caf50; border: none; color: white; padding: 0 10px; height: 100%; cursor: pointer; }
        .icon-btn { background: #262626; border: 1px solid #3d3d3d; color: #fff; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1em; }

        .app-views { height: calc(100vh - 110px); width: 100%; position: relative; overflow: hidden; }
        .view { display: none; height: 100%; width: 100%; overflow-y: auto; }
        .view.active { display: block; }
        #view-chart { overflow: hidden; position: relative; }
        #tv_chart_container { width: 100%; height: 100%; }

        .exit-fs-btn { display: none; position: absolute; top: 10px; left: 10px; z-index: 999; background: rgba(0,0,0,0.8); border: 1px solid #4caf50; color: #4caf50; padding: 4px 10px; border-radius: 6px; font-size: 0.8em; font-weight: bold; cursor: pointer; }
        body.is-fullscreen .app-header, body.is-fullscreen .bottom-nav { display: none !important; }
        body.is-fullscreen .app-views { height: 100vh !important; }
        body.is-fullscreen .exit-fs-btn { display: block; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 58px; background: #1a1a1a; border-top: 1px solid #2d2d2d; display: flex; justify-content: space-around; align-items: center; z-index: 950; }
        .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; background: transparent; border: none; color: #888; font-size: 0.75em; cursor: pointer; gap: 3px; }
        .nav-btn.active { color: #4caf50; font-weight: bold; }
        .nav-icon { font-size: 1.3em; }

        .plan-panel { position: absolute; bottom: 10px; left: 10px; right: 10px; max-width: 480px; margin: 0 auto; background: rgba(24,24,24,0.95); backdrop-filter: blur(10px); border: 1px solid #3d3d3d; border-radius: 12px; padding: 10px 12px; z-index: 900; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        .plan-panel.minimized { padding: 6px 12px; cursor: pointer; border-color: #4caf50; }
        .plan-panel.minimized .plan-body { display: none; }
        .plan-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 6px; margin-bottom: 8px; }
        .plan-panel.minimized .plan-header { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .plan-title { font-weight: bold; color: #4caf50; font-size: 1em; }

        .trade-plan-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
        .plan-box { background: #1c1c1c; border: 1px solid #333; border-radius: 6px; padding: 6px 2px; text-align: center; }
        .plan-box.entry { border-color: #2196f3; }
        .plan-box.stop { border-color: #f44336; }
        .plan-box.target { border-color: #4caf50; }
        .plan-lbl { font-size: 0.68em; color: #aaa; margin-bottom: 2px; }
        .plan-val { font-size: 0.92em; font-weight: bold; }
        .plan-val.blue { color: #64b5f6; }
        .plan-val.red { color: #e57373; }
        .plan-val.green { color: #81c784; }

        .plan-analysis-text { font-size: 0.82em; color: #ddd; background: #1c1c1c; padding: 8px; border-radius: 6px; border-right: 3px solid #4caf50; line-height: 1.4; }
        .badges-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
        .stat-badge { background: #222; border: 1px solid #444; color: #81c784; font-size: 0.72em; padding: 2px 6px; border-radius: 4px; }

        .screener-top-bar { display: flex; gap: 8px; padding: 10px 12px 0 12px; overflow-x: auto; }
        .filter-chip { background: #242424; border: 1px solid #3d3d3d; color: #aaa; padding: 5px 12px; border-radius: 16px; font-size: 0.8em; white-space: nowrap; cursor: pointer; }
        .filter-chip.active { background: #4caf50; color: #000; font-weight: bold; border-color: #4caf50; }
        .screener-list { padding: 12px; }
        .stock-card { background: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .stock-ticker { font-size: 1.1em; font-weight: bold; color: #4caf50; }
        .stock-sub { font-size: 0.8em; color: #999; margin-top: 2px; }
        .stock-price-box { text-align: left; }
        .stock-price { font-size: 1.1em; font-weight: bold; }

        .portfolio-view { padding: 14px; }
        .stats-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
        .stat-card { background: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 8px; padding: 10px; text-align: center; }
        .stat-card-val { font-size: 1.1em; font-weight: bold; color: #4caf50; }
        .stat-card-lbl { font-size: 0.7em; color: #888; margin-top: 2px; }

        .trade-form { background: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 10px; padding: 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
        .form-row { display: flex; gap: 8px; }
        .trade-form input { flex: 1; padding: 9px 12px; border-radius: 6px; border: 1px solid #3d3d3d; background: #262626; color: #fff; font-size: 0.9em; }
        .trade-form button { background: #1976d2; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .trade-item { background: #1e1e1e; border: 1px solid #2d2d2d; border-right: 4px solid #1976d2; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .trade-item.closed { border-right-color: #666; opacity: 0.85; }
        .trade-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .trade-info { font-size: 0.85em; color: #aaa; line-height: 1.5; }
        .trade-actions { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
        .btn-action { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 5px 10px; border-radius: 4px; font-size: 0.8em; cursor: pointer; }
        .btn-close-trade { background: #c62828; border-color: #b71c1c; }
        .profit { color: #4caf50; font-weight: bold; }
        .loss { color: #f44336; font-weight: bold; }

        .settings-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 998; opacity: 0; pointer-events: none; transition: 0.3s; }
        .settings-overlay.active { opacity: 1; pointer-events: auto; }
        .settings-drawer { position: fixed; top: 0; right: -340px; width: 330px; max-width: 90%; height: 100vh; background: #1a1a1a; z-index: 999; transition: right 0.3s ease; border-left: 1px solid #333; display: flex; flex-direction: column; }
        .settings-drawer.active { right: 0; }
        .drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #2d2d2d; }
        .drawer-body { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        .setting-box { background: #242424; border: 1px solid #333; border-radius: 8px; padding: 12px; }
        .setting-box-title { font-weight: bold; font-size: 0.9em; margin-bottom: 8px; display: block; color: #4caf50; }
        .google-btn { background: #4285F4; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 8px; }
        .logout-btn { background: #333; color: #ff5252; border: 1px solid #555; padding: 8px; border-radius: 6px; width: 100%; cursor: pointer; margin-top: 8px; font-weight: bold; }
        .calc-input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #181818; color: #fff; margin-bottom: 6px; font-size: 0.85em; }

        body.light-mode { background-color: #f4f6f9; color: #222; }
        body.light-mode .app-header, body.light-mode .bottom-nav, body.light-mode .settings-drawer { background: #fff; border-color: #ddd; }
        body.light-mode .stock-card, body.light-mode .trade-form, body.light-mode .trade-item, body.light-mode .plan-panel, body.light-mode .stat-card { background: #fff; border-color: #ddd; color: #222; }
        body.light-mode .plan-analysis-text, body.light-mode .setting-box, body.light-mode .filter-chip, body.light-mode .plan-box { background: #f0f3f6; color: #333; }
        body.light-mode .trade-form input, body.light-mode .search-container input, body.light-mode .calc-input { background: #f0f0f0; color: #222; }
        body.light-mode .stat-badge { background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>
    <div class="app-header">
        <div class="header-title"><span>📈</span><span id="headerSymbol">SPY</span></div>
        <div class="header-actions">
            <div class="search-container">
                <input type="text" id="manualSearch" placeholder="חיפוש..." onkeypress="if(event.key === 'Enter') handleSearch()">
                <button onclick="handleSearch()">🔍</button>
            </div>
            <button class="icon-btn" title="מסך מלא" onclick="toggleFullScreenChart()">⛶</button>
            <button class="icon-btn" title="הגדרות" onclick="toggleSettings(true)">☰</button>
        </div>
    </div>

    <div class="app-views">
        <div id="view-screener" class="view">
            <div class="screener-top-bar">
                <div class="filter-chip active" onclick="filterScreener('all', this)">הכל</div>
                <div class="filter-chip" onclick="filterScreener('breakout', this)">פריצות (Breakout)</div>
                <div class="filter-chip" onclick="filterScreener('pullback', this)">נסיגות (Pullback)</div>
            </div>
            <div class="screener-list" id="stockListContainer"><p style="text-align:center; color:#888; padding-top:40px;">טוען סריקה...</p></div>
        </div>

        <div id="view-chart" class="view active">
            <button class="exit-fs-btn" onclick="toggleFullScreenChart()">✕ יציאה</button>
            <div id="tv_chart_container"></div>
            <div class="plan-panel" id="planPanel">
                <div class="plan-header" onclick="togglePlanPanel()">
                    <div class="plan-title"><span>🎯</span><span id="planStockTitle">תוכנית מסחר</span></div>
                    <button class="btn-action" style="padding:2px 8px; font-size:0.75em;" id="planToggleBtn">מזער</button>
                </div>
                <div class="plan-body" id="planBody"></div>
            </div>
        </div>

        <div id="view-portfolio" class="view">
            <div class="portfolio-view">
                <div class="stats-summary">
                    <div class="stat-card"><div class="stat-card-val" id="statWinRate">0%</div><div class="stat-card-lbl">Win Rate</div></div>
                    <div class="stat-card"><div class="stat-card-val" id="statTotalPnl">$0</div><div class="stat-card-lbl">רווח כולל</div></div>
                    <div class="stat-card"><div class="stat-card-val" id="statTradesCount">0</div><div class="stat-card-lbl">עסקאות</div></div>
                </div>
                <div id="authRequiredNotice" class="setting-box" style="text-align:center; display:none;">
                    <p style="margin:0 0 6px 0;">לניהול תיק מסונכרן:</p>
                    <button class="google-btn" onclick="loginGoogle()">התחבר עם Google</button>
                </div>
                <div id="portfolioMainArea">
                    <div class="trade-form">
                        <b style="font-size:0.95em;">הוספת פוזיציה</b>
                        <div class="form-row"><input type="text" id="tradeTicker" placeholder="סימול (AAPL)"><input type="date" id="tradeDate"></div>
                        <div class="form-row"><input type="number" id="tradePrice" placeholder="שער ($)" step="0.01"><input type="number" id="tradeComm" placeholder="עמלה ($)" step="0.01"></div>
                        <button onclick="addTrade()">שמור פוזיציה</button>
                    </div>
                    <div id="tradesList"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn" id="nav-screener" onclick="switchNav('screener')"><span class="nav-icon">🔍</span><span>סורק</span></button>
        <button class="nav-btn active" id="nav-chart" onclick="switchNav('chart')"><span class="nav-icon">📈</span><span>גרף</span></button>
        <button class="nav-btn" id="nav-portfolio" onclick="switchNav('portfolio')"><span class="nav-icon">💼</span><span>תיק</span></button>
    </div>

    <div class="settings-overlay" id="settingsOverlay" onclick="toggleSettings(false)"></div>
    <div class="settings-drawer" id="settingsDrawer">
        <div class="drawer-head"><b style="font-size:1.05em;">הגדרות וכלים</b><button class="btn-action" onclick="toggleSettings(false)">✕</button></div>
        <div class="drawer-body">
            <div class="setting-box">
                <span class="setting-box-title">📐 מחשבון סיכון וגודל פוזיציה</span>
                <input type="number" id="calcPortfolio" class="calc-input" placeholder="הון תיק ($)" value="10000" oninput="calculateRisk()">
                <div style="display:flex; gap:6px;">
                    <input type="number" id="calcRiskPct" class="calc-input" placeholder="סיכון (%)" value="1.5" step="0.1" oninput="calculateRisk()">
                    <input type="number" id="calcEntry" class="calc-input" placeholder="כניסה ($)" oninput="calculateRisk()">
                </div>
                <input type="number" id="calcStop" class="calc-input" placeholder="סטופ ($)" oninput="calculateRisk()">
                <div id="calcResult" style="background:#181818; padding:8px; border-radius:6px; font-size:0.85em; color:#81c784; margin-top:4px;">הזן נתונים לחישוב</div>
            </div>
            <div class="setting-box">
                <span class="setting-box-title">📥 ייצוא נתונים</span>
                <button class="btn-action" style="width:100%; padding:9px; font-weight:bold;" onclick="exportTradesToCSV()">📊 ייצא ל-CSV / Excel</button>
            </div>
            <div class="setting-box">
                <span class="setting-box-title">👤 חשבון</span>
                <div id="userProfileStatus" style="font-size:0.85em; color:#aaa;">לא מחובר</div>
                <div id="authActionArea"><button class="google-btn" onclick="loginGoogle()">התחבר עם Google</button></div>
            </div>
            <div class="setting-box">
                <span class="setting-box-title">🎨 תצוגה</span>
                <button class="btn-action" id="themeBtn" onclick="toggleTheme()">☀️ מצב יום</button>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD0JgU15_MKcwZK0eZIRinqnrOJYppzgp8",
            authDomain: "swing-portfolio.firebaseapp.com",
            projectId: "swing-portfolio",
            storageBucket: "swing-portfolio.firebasestorage.app",
            messagingSenderId: "1021148994913",
            appId: "1:1021148994913:web:d31fadc54acace2cafb920"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUser = null;
        let unsubscribeTrades = null;
        let widget = null;
        let currentTheme = 'dark';
        let activeSymbol = 'SPY';
        let allScreenerStocks = [];
        let allUserTrades = [];

        document.getElementById('tradeDate').valueAsDate = new Date();

        function loadChart(ticker) {
            activeSymbol = ticker;
            document.getElementById('headerSymbol').innerText = ticker;
            const bg = currentTheme === 'light' ? "#ffffff" : "#121212";

            widget = new TradingView.widget({
                "autosize": true, "symbol": ticker, "interval": "D", "timezone": "Etc/UTC",
                "theme": currentTheme, "style": "1", "locale": "he_IL", "enable_publishing": false,
                "backgroundColor": bg, "hide_top_toolbar": false, "save_image": false,
                "container_id": "tv_chart_container",
                "studies": [
                    { id: "MASimple@tv-basicstudies", inputs: { length: 50 }, title: "SMA 50" },
                    { id: "MASimple@tv-basicstudies", inputs: { length: 150 }, title: "SMA 150" },
                    { id: "RSI@tv-basicstudies", inputs: { length: 14 } }
                ]
            });
        }

        function toggleFullScreenChart() {
            document.body.classList.toggle('is-fullscreen');
            setTimeout(() => { loadChart(activeSymbol); }, 150);
        }

        function switchNav(tab) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`view-${tab}`).classList.add('active');
            document.getElementById(`nav-${tab}`).classList.add('active');
            if (tab === 'chart' && !widget) loadChart(activeSymbol);
            if (tab === 'portfolio') loadTrades();
        }

        function toggleSettings(open) {
            document.getElementById('settingsDrawer').classList.toggle('active', open);
            document.getElementById('settingsOverlay').classList.toggle('active', open);
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            currentTheme = document.body.classList.contains('light-mode') ? 'light' : 'dark';
            document.getElementById('themeBtn').innerText = currentTheme === 'light' ? '🌙 מצב לילה' : '☀️ מצב יום';
            loadChart(activeSymbol);
        }

        function togglePlanPanel() {
            const panel = document.getElementById('planPanel');
            const btn = document.getElementById('planToggleBtn');
            panel.classList.toggle('minimized');
            btn.innerText = panel.classList.contains('minimized') ? 'פתח' : 'מזער';
        }

        function calculateRisk() {
            const capital = parseFloat(document.getElementById('calcPortfolio').value) || 0;
            const riskPct = parseFloat(document.getElementById('calcRiskPct').value) || 0;
            const entry = parseFloat(document.getElementById('calcEntry').value) || 0;
            const stop = parseFloat(document.getElementById('calcStop').value) || 0;
            const resBox = document.getElementById('calcResult');

            if (!capital || !riskPct || !entry || !stop || entry <= stop) {
                resBox.innerHTML = 'הזן נתונים תקינים (כניסה מעל סטופ).';
                return;
            }

            const maxRiskDollars = (capital * (riskPct / 100));
            const riskPerShare = entry - stop;
            const sharesToBuy = Math.floor(maxRiskDollars / riskPerShare);
            const totalPositionValue = (sharesToBuy * entry).toFixed(2);

            resBox.innerHTML = `
                <b>סיכון בעסקה:</b> $${maxRiskDollars.toFixed(2)} (${riskPct}%)<br>
                <b>כמות לקנייה:</b> ${sharesToBuy} מניות<br>
                <b>שווי פוזיציה:</b> $${Number(totalPositionValue).toLocaleString()}
            `;
        }

        function renderStockAnalysis(stock) {
            const panel = document.getElementById('planPanel');
            const body = document.getElementById('planBody');
            panel.classList.remove('minimized');
            document.getElementById('planToggleBtn').innerText = 'מזער';

            const price = parseFloat(stock.price) || 100;
            const sma50 = parseFloat(stock.sma50) || parseFloat(stock.sma_50) || (price * 0.96);
            const sma150 = parseFloat(stock.sma150) || parseFloat(stock.sma_150) || (price * 0.92);
            
            const entry = stock.entry ? parseFloat(stock.entry) : Number(price).toFixed(2);
            let stop = stock.stop_loss ? parseFloat(stock.stop_loss) : Number(Math.min(sma50 * 0.985, price * 0.96)).toFixed(2);
            if (stop >= entry) stop = (entry * 0.96).toFixed(2);

            const riskPerShare = entry - stop;
            const tp1 = stock.tp1 ? parseFloat(stock.tp1) : Number(parseFloat(entry) + (riskPerShare * 1.5)).toFixed(2);
            const tp2 = stock.tp2 ? parseFloat(stock.tp2) : Number(parseFloat(entry) + (riskPerShare * 2.5)).toFixed(2);

            const riskPct = (((entry - stop) / entry) * 100).toFixed(1);
            const tp1Pct = (((tp1 - entry) / entry) * 100).toFixed(1);
            const tp2Pct = (((tp2 - entry) / entry) * 100).toFixed(1);

            document.getElementById('planStockTitle').innerText = `${stock.ticker} - $${price}`;
            document.getElementById('calcEntry').value = entry;
            document.getElementById('calcStop').value = stop;
            calculateRisk();

            body.innerHTML = `
                <div class="trade-plan-grid">
                    <div class="plan-box entry"><div class="plan-lbl">כניסה</div><div class="plan-val blue">$${entry}</div></div>
                    <div class="plan-box stop"><div class="plan-lbl">סטופ (-${riskPct}%)</div><div class="plan-val red">$${stop}</div></div>
                    <div class="plan-box target"><div class="plan-lbl">יעד 1 (+${tp1Pct}%)</div><div class="plan-val green">$${tp1}</div></div>
                    <div class="plan-box target"><div class="plan-lbl">יעד 2 (+${tp2Pct}%)</div><div class="plan-val green">$${tp2}</div></div>
                </div>
                <div class="plan-analysis-text"><b>ניתוח טכני:</b> ${stock.recommendation || stock.setup || 'מגמה חיובית מעל ממוצע 150 יום.'}</div>
                <div class="badges-row">
                    <span class="stat-badge">RSI: ${stock.rsi || '50'}</span>
                    <span class="stat-badge">MA50: $${Number(sma50).toFixed(2)}</span>
                    <span class="stat-badge">MA150: $${Number(sma150).toFixed(2)}</span>
                </div>
            `;
        }

        function selectStockFromList(stock) {
            loadChart(stock.ticker);
            renderStockAnalysis(stock);
            switchNav('chart');
        }

        function handleSearch() {
            const sym = document.getElementById('manualSearch').value.toUpperCase().trim();
            if (sym) {
                loadChart(sym);
                renderStockAnalysis({ ticker: sym, price: 0, setup: 'חיפוש ידני' });
                switchNav('chart');
            }
        }

        async function loadScreener() {
            try {
                const res = await fetch('screener_results_v2.json?nocache=' + new Date().getTime());
                const data = await res.json();
                allScreenerStocks = data.stocks || [];
                renderScreenerList(allScreenerStocks);
                if (allScreenerStocks.length > 0) {
                    activeSymbol = allScreenerStocks[0].ticker;
                    renderStockAnalysis(allScreenerStocks[0]);
                }
            } catch (e) {
                document.getElementById('stockListContainer').innerHTML = '<p style="text-align:center; color:#888; padding-top:40px;">ממתין לסריקה היומית.</p>';
            }
            loadChart(activeSymbol);
        }

        function renderScreenerList(stocks) {
            const container = document.getElementById('stockListContainer');
            container.innerHTML = '';
            stocks.forEach((stock) => {
                const card = document.createElement('div');
                card.className = 'stock-card';
                card.innerHTML = `
                    <div><div class="stock-ticker">${stock.ticker}</div><div class="stock-sub">${stock.setup || 'סטאפ חיובי'}</div></div>
                    <div class="stock-price-box"><div class="stock-price">$${stock.price || ''}</div><div style="font-size:0.75em; color:#4caf50; text-align:left;">תוכנית ➔</div></div>
                `;
                card.onclick = () => selectStockFromList(stock);
                container.appendChild(card);
            });
        }

        function filterScreener(type, btn) {
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            if (type === 'all') {
                renderScreenerList(allScreenerStocks);
            } else {
                const filtered = allScreenerStocks.filter(s => ((s.setup || '') + (s.recommendation || '')).toLowerCase().includes(type));
                renderScreenerList(filtered);
            }
        }

        auth.onAuthStateChanged((user) => {
            currentUser = user;
            const profileStatus = document.getElementById('userProfileStatus');
            const authArea = document.getElementById('authActionArea');
            const authNotice = document.getElementById('authRequiredNotice');
            const mainArea = document.getElementById('portfolioMainArea');

            if (user) {
                profileStatus.innerText = user.email;
                authArea.innerHTML = `<button class="logout-btn" onclick="auth.signOut()">התנתק</button>`;
                authNotice.style.display = 'none';
                mainArea.style.display = 'block';
                loadTrades();
            } else {
                profileStatus.innerText = 'לא מחובר';
                authArea.innerHTML = `<button class="google-btn" onclick="loginGoogle()">התחבר עם Google</button>`;
                authNotice.style.display = 'block';
                mainArea.style.display = 'none';
                if (unsubscribeTrades) unsubscribeTrades();
            }
        });

        function loginGoogle() {
            auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => alert(e.message));
        }

        async function addTrade() {
            if (!currentUser) return;
            const ticker = document.getElementById('tradeTicker').value.toUpperCase().trim();
            const buyPrice = parseFloat(document.getElementById('tradePrice').value);
            const buyComm = parseFloat(document.getElementById('tradeComm').value) || 0;
            const buyDate = document.getElementById('tradeDate').value || new Date().toISOString().split('T')[0];

            if (!ticker || !buyPrice) { alert("הזן סימול ומחיר."); return; }

            await db.collection("trades").add({ userId: currentUser.uid, ticker, buyPrice, buyComm, buyDate, status: 'open', timestamp: Date.now() });
            document.getElementById('tradeTicker').value = '';
            document.getElementById('tradePrice').value = '';
            document.getElementById('tradeComm').value = '';
        }

        async function closeTrade(docId, buyPrice, buyComm) {
            const sellPrice = parseFloat(prompt("שער מכירה ($):"));
            if (!sellPrice) return;
            const sellComm = parseFloat(prompt("עמלת מכירה ($):", "1.00")) || 0;
            const today = new Date().toISOString().split('T')[0];
            const sellDate = prompt("תאריך מכירה (YYYY-MM-DD):", today) || today;

            const totalCost = buyPrice + buyComm;
            const totalReturn = sellPrice - sellComm;
            const pnlDollars = (totalReturn - totalCost).toFixed(2);
            const pnlPercent = (((totalReturn - totalCost) / totalCost) * 100).toFixed(2);

            await db.collection("trades").doc(docId).update({ sellPrice, sellComm, sellDate, status: 'closed', pnlDollars, pnlPercent });
        }

        async function deleteTrade(docId) {
            if (confirm("למחוק עסקה זו?")) await db.collection("trades").doc(docId).delete();
        }

        function calculatePortfolioStats(trades) {
            const closed = trades.filter(t => t.status === 'closed');
            if (closed.length === 0) {
                document.getElementById('statWinRate').innerText = '0%';
                document.getElementById('statTotalPnl').innerText = '$0';
                document.getElementById('statTradesCount').innerText = trades.length;
                return;
            }
            const wins = closed.filter(t => parseFloat(t.pnlDollars) > 0).length;
            const totalPnl = closed.reduce((acc, t) => acc + (parseFloat(t.pnlDollars) || 0), 0).toFixed(2);
            document.getElementById('statWinRate').innerText = `${((wins / closed.length) * 100).toFixed(1)}%`;
            document.getElementById('statTotalPnl').innerText = `$${Number(totalPnl).toLocaleString()}`;
            document.getElementById('statTotalPnl').style.color = totalPnl >= 0 ? '#4caf50' : '#f44336';
            document.getElementById('statTradesCount').innerText = trades.length;
        }

        function exportTradesToCSV() {
            if (allUserTrades.length === 0) { alert("אין עסקאות לייצוא."); return; }
            let csv = "Symbol,Status,Buy Date,Buy Price,Buy Comm,Sell Date,Sell Price,Sell Comm,PnL ($),PnL (%)\n";
            allUserTrades.forEach(t => {
                csv += `${t.ticker},${t.status},${t.buyDate || ''},${t.buyPrice || ''},${t.buyComm || 0},${t.sellDate || ''},${t.sellPrice || ''},${t.sellComm || 0},${t.pnlDollars || ''},${t.pnlPercent || ''}%\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `Trades_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function loadTrades() {
            if (!currentUser) return;
            if (unsubscribeTrades) unsubscribeTrades();

            unsubscribeTrades = db.collection("trades").where("userId", "==", currentUser.uid).onSnapshot((snapshot) => {
                const container = document.getElementById('tradesList');
                container.innerHTML = '';
                allUserTrades = [];

                if (snapshot.empty) {
                    container.innerHTML = '<p style="text-align:center; color:#888;">התיק ריק כרגע.</p>';
                    calculatePortfolioStats([]);
                    return;
                }

                snapshot.forEach(doc => allUserTrades.push({ id: doc.id, ...doc.data() }));
                allUserTrades.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                calculatePortfolioStats(allUserTrades);

                allUserTrades.forEach((trade) => {
                    const div = document.createElement('div');
                    div.className = `trade-item ${trade.status}`;
                    let statusHtml = trade.status === 'open' ? `<button class="btn-action btn-close-trade" onclick="closeTrade('${trade.id}', ${trade.buyPrice}, ${trade.buyComm})">סגור פוזיציה</button>` : `<div class="${trade.pnlDollars >= 0 ? 'profit' : 'loss'}">תשואה: ${trade.pnlPercent}% ($${trade.pnlDollars})</div>`;

                    div.innerHTML = `
                        <div class="trade-top" onclick="loadChart('${trade.ticker}'); switchNav('chart');">
                            <span class="stock-ticker">${trade.ticker}</span>
                            <span style="font-size:0.8em;">${trade.status === 'open' ? '🟢 פתוח' : '⚪ סגור'}</span>
                        </div>
                        <div class="trade-info"><b>קנייה:</b> $${trade.buyPrice} (${trade.buyDate || '-'}) | עמלה: $${trade.buyComm}${trade.status === 'closed' ? `<br><b>מכירה:</b> $${trade.sellPrice} (${trade.sellDate || '-'}) | עמלה: $${trade.sellComm}` : ''}</div>
                        <div class="trade-actions">${statusHtml}<button class="btn-action" style="margin-right:auto; color:#ff5252;" onclick="deleteTrade('${trade.id}')">🗑️</button></div>
                    `;
                    container.appendChild(div);
                });
            });
        }

        loadScreener();
    </script>
</body>
</html>
