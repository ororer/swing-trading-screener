<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מערכת סריקת מניות וניהול תיק</title>
    <!-- טעינת ספריות Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    
    <style>
        /* עיצוב כללי */
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; transition: 0.3s; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .header-controls { display: flex; align-items: center; gap: 15px; }
        
        .search-box { display: flex; align-items: center; background: #2d2d2d; border: 1px solid #444; border-radius: 20px; overflow: hidden; }
        .search-box input { background: transparent; border: none; color: #fff; padding: 8px 15px; outline: none; width: 150px; }
        .search-box button { background: #4caf50; border: none; color: white; padding: 8px 15px; cursor: pointer; font-weight: bold; }
        
        .theme-btn { background: #2d2d2d; color: #fff; border: 1px solid #444; padding: 8px 16px; border-radius: 20px; cursor: pointer; }
        
        .container { display: flex; gap: 20px; height: 85vh; }
        .sidebar { width: 400px; background: #1e1e1e; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; transition: 0.3s; }
        .main-content { flex-grow: 1; background: #1e1e1e; padding: 15px; border-radius: 8px; }
        
        /* טאבים בסרגל הצד */
        .tabs { display: flex; margin-bottom: 15px; border-bottom: 1px solid #444; }
        .tab-btn { flex: 1; padding: 10px; background: transparent; border: none; color: #888; cursor: pointer; font-size: 1.1em; border-bottom: 2px solid transparent; transition: 0.3s; }
        .tab-btn.active { color: #4caf50; border-bottom: 2px solid #4caf50; font-weight: bold; }
        
        .tab-content { display: none; flex-direction: column; height: 100%; overflow-y: auto; }
        .tab-content.active { display: flex; }
        
        /* סורק */
        .stock-item { padding: 15px; margin-bottom: 10px; background: #2d2d2d; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
        .stock-item:hover, .stock-item.active { border-color: #4caf50; background: #353535; }
        .stock-ticker { font-size: 1.2em; font-weight: bold; color: #4caf50; }
        
        /* תיק השקעות */
        .portfolio-form { background: #2d2d2d; padding: 15px; border-radius: 6px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .portfolio-form input { padding: 8px; border-radius: 4px; border: 1px solid #444; background: #1a1a1a; color: #fff; }
        .portfolio-form button { background: #1976d2; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .portfolio-form button:hover { background: #1565c0; }
        
        .trade-card { background: #2d2d2d; padding: 12px; border-radius: 6px; margin-bottom: 10px; border-left: 4px solid #1976d2; }
        .trade-card.closed { border-left-color: #757575; opacity: 0.8; }
        .trade-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .trade-stats { font-size: 0.9em; color: #bbb; line-height: 1.5; }
        .trade-actions { margin-top: 10px; }
        .close-btn { background: #d32f2f; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8em; }
        .profit { color: #4caf50; font-weight: bold; }
        .loss { color: #f44336; font-weight: bold; }

        /* מצב יום */
        body.light-mode { background-color: #f4f6f9; color: #222; }
        body.light-mode .sidebar, body.light-mode .main-content { background: #fff; border: 1px solid #ddd; }
        body.light-mode .stock-item, body.light-mode .portfolio-form, body.light-mode .trade-card { background: #fff; border: 1px solid #ddd; }
        body.light-mode .portfolio-form input { background: #fff; color: #222; border-color: #ccc; }
        body.light-mode .theme-btn, body.light-mode .search-box { background: #fff; border-color: #ccc; }
        body.light-mode .search-box input { color: #222; }
    </style>
</head>
<body>
    <div class="header">
        <h2>מערכת סריקת מניות וניהול תיק</h2>
        <div class="header-controls">
            <div class="search-box">
                <input type="text" id="manualSearch" placeholder="חפש מניה..." onkeypress="if(event.key === 'Enter') searchManualStock()">
                <button onclick="searchManualStock()">חפש</button>
            </div>
            <button class="theme-btn" id="themeToggleBtn" onclick="toggleTheme()">☀️ מצב יום</button>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('screener')">🔍 סורק מניות</button>
                <button class="tab-btn" onclick="switchTab('portfolio')">💼 תיק השקעות</button>
            </div>
            
            <!-- סורק -->
            <div id="screener" class="tab-content active">
                <div id="stockList"><p>טוען נתונים...</p></div>
            </div>
            
            <!-- תיק השקעות -->
            <div id="portfolio" class="tab-content">
                <div class="portfolio-form">
                    <b>הוסף פוזיציה חדשה</b>
                    <input type="text" id="tradeTicker" placeholder="סימול (למשל TSLA)">
                    <input type="number" id="tradePrice" placeholder="שער קנייה ($)" step="0.01">
                    <input type="number" id="tradeComm" placeholder="עמלת קנייה ($)" step="0.01">
                    <button onclick="addTrade()">הוסף לתיק</button>
                </div>
                <div id="portfolioList"><p>טוען עסקאות...</p></div>
            </div>
        </div>

        <div class="main-content" id="tv_chart_container"></div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        // --- 1. הגדרות Firebase שלך ---
        const firebaseConfig = {
            apiKey: "AIzaSyD0JgU15_MKcwZK0eZIRinqnrOJYppzgp8",
            authDomain: "swing-portfolio.firebaseapp.com",
            projectId: "swing-portfolio",
            storageBucket: "swing-portfolio.firebasestorage.app",
            messagingSenderId: "1021148994913",
            appId: "1:1021148994913:web:d31fadc54acace2cafb920"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- 2. משתנים גלובליים ---
        let widget;
        let currentTheme = 'dark';
        let allStocksData = [];

        // --- 3. גרף TradingView ---
        function initChart(ticker) {
            const bgColor = currentTheme === 'light' ? "#ffffff" : "#1e1e1e";
            widget = new TradingView.widget({
                "autosize": true, "symbol": ticker, "interval": "D", "timezone": "Etc/UTC",
                "theme": currentTheme, "style": "1", "locale": "he_IL", "enable_publishing": false,
                "backgroundColor": bgColor, "hide_top_toolbar": false, "save_image": false,
                "container_id": "tv_chart_container"
            });
        }

        // --- 4. ממשק וטאבים ---
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            currentTheme = document.body.classList.contains('light-mode') ? 'light' : 'dark';
            document.getElementById('themeToggleBtn').innerText = currentTheme === 'light' ? '🌙 מצב לילה' : '☀️ מצב יום';
            initChart(widget ? widget.options.symbol : 'SPY');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content, .tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
            if(tabId === 'portfolio') loadTrades();
        }

        function searchManualStock() {
            const ticker = document.getElementById('manualSearch').value.toUpperCase().trim();
            if(ticker) initChart(ticker);
        }

        // --- 5. טעינת תוצאות הסורק המקומי ---
        async function loadScreenerData() {
            try {
                const response = await fetch('screener_results_v2.json?nocache=' + new Date().getTime());
                const data = await response.json();
                const list = document.getElementById('stockList');
                list.innerHTML = '';
                
                data.stocks.forEach((stock, index) => {
                    const div = document.createElement('div');
                    div.className = 'stock-item';
                    div.innerHTML = `<span class="stock-ticker">${stock.ticker}</span> - $${stock.price}<br><small>${stock.recommendation || 'מגמה עולה'}</small>`;
                    div.onclick = () => initChart(stock.ticker);
                    list.appendChild(div);
                });
                if(data.stocks.length > 0) initChart(data.stocks[0].ticker);
            } catch (e) {
                document.getElementById('stockList').innerHTML = '<p>לא נטען קובץ סריקה. חפש מניה ידנית.</p>';
                initChart('SPY');
            }
        }

        // --- 6. ניהול תיק השקעות (Firebase) ---
        async function addTrade() {
            const ticker = document.getElementById('tradeTicker').value.toUpperCase();
            const buyPrice = parseFloat(document.getElementById('tradePrice').value);
            const buyComm = parseFloat(document.getElementById('tradeComm').value) || 0;
            
            if(!ticker || !buyPrice) { alert("הכנס סימול ושער קנייה."); return; }
            
            await db.collection("trades").add({
                ticker, buyPrice, buyComm,
                status: 'open',
                date: new Date().toISOString()
            });
            
            document.getElementById('tradeTicker').value = '';
            document.getElementById('tradePrice').value = '';
            document.getElementById('tradeComm').value = '';
            loadTrades();
        }

        async function closeTrade(docId, buyPrice, buyComm) {
            const sellPrice = parseFloat(prompt("הכנס שער מכירה ($):"));
            const sellComm = parseFloat(prompt("הכנס עמלת מכירה ($):")) || 0;
            
            if(!sellPrice) return;
            
            // חישוב רווח/הפסד באחוזים ובדולרים
            const totalCost = buyPrice + buyComm;
            const totalReturn = sellPrice - sellComm;
            const pnlDollars = (totalReturn - totalCost).toFixed(2);
            const pnlPercent = (((totalReturn - totalCost) / totalCost) * 100).toFixed(2);
            
            await db.collection("trades").doc(docId).update({
                sellPrice, sellComm, status: 'closed',
                pnlDollars, pnlPercent
            });
            loadTrades();
        }

        function loadTrades() {
            db.collection("trades").orderBy("date", "desc").onSnapshot((querySnapshot) => {
                const list = document.getElementById('portfolioList');
                list.innerHTML = '';
                
                if(querySnapshot.empty) {
                    list.innerHTML = '<p>התיק ריק כרגע.</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const trade = doc.data();
                    const div = document.createElement('div');
                    div.className = `trade-card ${trade.status}`;
                    
                    let statusHtml = '';
                    if(trade.status === 'open') {
                        statusHtml = `<button class="close-btn" onclick="closeTrade('${doc.id}', ${trade.buyPrice}, ${trade.buyComm})">סגור פוזיציה</button>`;
                    } else {
                        let pnlClass = trade.pnlDollars >= 0 ? 'profit' : 'loss';
                        statusHtml = `<div class="${pnlClass}">תשואה: ${trade.pnlPercent}% ($${trade.pnlDollars})</div>`;
                    }

                    div.innerHTML = `
                        <div class="trade-header" style="cursor:pointer;" onclick="initChart('${trade.ticker}')">
                            <span class="stock-ticker">${trade.ticker}</span>
                            <span>${trade.status === 'open' ? '🟢 פתוח' : '⚪ סגור'}</span>
                        </div>
                        <div class="trade-stats">
                            <b>קנייה:</b> $${trade.buyPrice} (עמלה: $${trade.buyComm})<br>
                            ${trade.status === 'closed' ? `<b>מכירה:</b> $${trade.sellPrice} (עמלה: $${trade.sellComm})` : ''}
                        </div>
                        <div class="trade-actions">${statusHtml}</div>
                    `;
                    list.appendChild(div);
                });
            });
        }

        // טעינה ראשונית
        loadScreenerData();
    </script>
</body>
</html>
